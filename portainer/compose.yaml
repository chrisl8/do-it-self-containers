services:
  portainer:
    container_name: portainer
    user: 1000:1000
    # This must be the ID of the Docker group.
    group_add:
      - ${DOCKER_GID:-985}
    image: portainer/portainer-ce
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${VOL_PORTAINER_DATA:-~/container-data}/container-mounts/portainer/data:/data
    networks:
      - portainer-net
    labels:
      # For homepage
      - homepage.group=${HOMEPAGE_GROUP}
      - homepage.name=portainer
      - homepage.weight=40
      - homepage.icon=/dashboard-icons/svg/portainer.svg
      - homepage.href=https://portainer.${TS_DOMAIN}
    # Derpy-but-works healthcheck. Portainer's image is distroless (no shell, no wget),
    # so we just exec the portainer binary itself, which exits 0 quickly on --version.
    # The old check ran the bundled /docker CLI, but portainer-ce dropped that binary
    # in the distroless images (>=2.39), so it can never pass anymore.
    healthcheck:
      test: ["CMD", "/portainer", "--version"]
      start_period: 300s
      start_interval: 5s
      interval: 5m
      timeout: 5s
      retries: 3
    restart: on-failure
  ts:
    container_name: portainer-ts
    image: tailscale/tailscale
    environment:
      - TS_HOSTNAME=portainer
      - TS_EXTRA_ARGS=--advertise-tags=tag:container
      - TS_SERVE_CONFIG=/config/tailscale-config.json
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_ENABLE_HEALTH_CHECK=true
      - TS_LOCAL_ADDR_PORT=127.0.0.1:9002
      - TS_AUTHKEY=${TS_AUTHKEY}
    volumes:
      - ${TS_STATE_HOST_DIR}:/var/lib/tailscale
      - ./tailscale-config:/config
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - net_admin
      - sys_module
    # https://github.com/tailscale/tailscale/issues/12758#issuecomment-2564770640
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:9002/healthz"]
      start_period: 300s
      start_interval: 5s
      interval: 5m
      timeout: 5s
      retries: 3
    networks:
      - portainer-net
    depends_on:
      portainer:
        condition: service_healthy
    restart: on-failure
networks:
  portainer-net:
