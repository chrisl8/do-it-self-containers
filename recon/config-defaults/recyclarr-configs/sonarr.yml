# yaml-language-server: $schema=https://schemas.recyclarr.dev/v8/config-schema.json
################################################################################
## Sonarr — single instance managing FOUR quality profiles:
##   - WEB-2160p                (standard TV; TRaSH d1498e7d...)
##   - [Anime] Remux-1080p      (anime;       TRaSH 20e0fc95...)
##   - Best Available (SD-1080p) (LOCAL, no trash_id -- see below)
##   - Best Available (up to 4K) (LOCAL; SD..WEB-2160p, the Seerr default)
##
## Recyclarr forbids two config instances pointing at the same Sonarr URL
## ("Split Instances"), so all profiles live here. quality_definition is
## `series` (a single instance allows only one); anime at 1080p fits within the
## series size caps, so this is safe for both.
##
## WHY A LOCAL PROFILE EXISTS HERE (the one deviation from "just use TRaSH"):
## TRaSH ships no SD profile. Every English Sonarr profile they publish is
## WEB-era -- WEB-1080p is WEB 1080p only, WEB-2160p is WEB 2160p only, and
## even WEB-2160p (Combined) is just those two stacked. The ONLY stock profile
## that reaches down to DVD is [Anime] Remux-1080p, which is unusable for live
## action because it sets min_format_score: 100 (a DVD release scoring 0 gets
## rejected outright) and drags in the anime tier scoring.
##
## So pre-HD shows had nowhere to go. Star Trek: Voyager sat at 0/173 files
## while an interactive search returned 497 releases (320 DVD, 0 WEBDL-2160p)
## and Sonarr correctly rejected every one: "DVD is not wanted in profile".
## Voyager was finished on SD NTSC video and never remastered, so no 4K master
## can ever exist. Same story for classic Doctor Who, Quatermass, M*A*S*H.
##
## This profile is the one to assign when a show is stuck. See
## docs/sonarr-stuck-series.md.
##
## LOCAL CUSTOM FORMAT (not managed here -- lives only in Sonarr):
##   "Upscaled (Unlabelled Groups)" scored -10000 below.
## The stock `Upscaled` CF is title-based and only catches releases that admit
## what they are. It misses `Star Trek Voyager SxxExx iNTERNAL MULTi 1080p WEB
## x264-N3TFL1X` -- 82 of those were found blocklisted, and NOT ONE says
## "upscale" anywhere in the title. Voyager has no HD master, so every one of
## its episodes sits below this profile's WEB 1080p cutoff forever, which means
## RSS can take an unlabelled upscale as an "upgrade" with no button pressed.
## The CF is deliberately narrow: release group AND (720p OR 1080p). That group
## also posts legitimate WEBDL-480p (26 such files are in the library), so
## blocking it outright would be wrong.
################################################################################

sonarr:
  series:
    base_url: http://localhost:8989
    api_key: !env_var SONARR_API_KEY

    quality_definition:
      type: series

    quality_profiles:
      - trash_id: d1498e7d189fbe6c7110ceaabb7473e6  # WEB-2160p
        reset_unmatched_scores:
          enabled: true
      - trash_id: 20e0fc959f1f1704bed501f23bdae76f  # [Anime] Remux-1080p
        reset_unmatched_scores:
          enabled: true
      # LOCAL profile -- no trash_id, because TRaSH has nothing to inherit from
      # (see header). Assign a series to this by hand when WEB-2160p can never
      # match it: DVD-era shows, or anything with a 1080p release but no 4K.
      # Capped at 1080p on purpose -- a show needing this profile has no 4K by
      # definition, and the cap makes DV Profile 5 (a 2160p format) structurally
      # impossible here, so the decode problem cannot come back through it.
      - name: Best Available (SD-1080p)
        # Wipes every CF not scored below back to 0, so the WEB-2160p x265/10bit
        # penalties and the anime tiers cannot leak in. x265 and 10bit stay at 0
        # deliberately: both are fine and common for DVD-era encodes.
        #
        # `except` protects a LOCAL custom format that Recyclarr cannot create or
        # score, because it has no trash_id. Without this line every sync resets
        # it to 0 and silently reopens the hole it exists to close. Any local CF
        # added to this profile in future must be listed here too.
        reset_unmatched_scores:
          enabled: true
          except:
            - Upscaled (Unlabelled Groups)
        min_format_score: 0
        quality_sort: top
        upgrade:
          allowed: true
          # Stop at WEB 1080p rather than Bluray-1080p -- these shows realistically
          # top out at DVD anyway, and the lower cutoff means fewer upgrade grabs.
          until_quality: WEB 1080p
          until_score: 10000
        # Ordered best -> worst (quality_sort: top).
        qualities:
          - name: Bluray-1080p
          - name: WEB 1080p
            qualities:
              - WEBDL-1080p
              - WEBRip-1080p
          - name: HDTV-1080p
          - name: Bluray-720p
          - name: WEB 720p
            qualities:
              - WEBDL-720p
              - WEBRip-720p
          - name: HDTV-720p
          - name: Bluray-480p
          - name: WEB 480p
            qualities:
              - WEBDL-480p
              - WEBRip-480p
          - name: DVD
          - name: SDTV

      # LOCAL profile #2 -- the DEFAULT for new requests (point Seerr's Sonarr
      # default here). WEB-2160p is 2160p-ONLY: a show with no 4K master (most
      # of the back catalog) has every release rejected "not wanted in profile"
      # and silently never grabs, so nearly every request needed hand-switching
      # (Clone Wars S1-6, 2026-10-13: 57 releases, 0 usable). This profile takes
      # the best that exists NOW (down to SDTV) and upgrades to WEB 2160p
      # automatically if one shows up.
      # Same junk floors as Best Available below, plus the DV P5 floor (matters
      # again because 2160p is allowed here), plus a mirror of WEB-2160p's own
      # scoring (see the 'up to 4K only' block in custom_formats).
      - name: Best Available (up to 4K)
        reset_unmatched_scores:
          enabled: true
          except:
            - Upscaled (Unlabelled Groups)
        min_format_score: 0
        quality_sort: top
        upgrade:
          allowed: true
          until_quality: WEB 2160p
          until_score: 10000
        qualities:
          - name: WEB 2160p
            qualities:
              - WEBDL-2160p
              - WEBRip-2160p
          - name: Bluray-1080p
          - name: WEB 1080p
            qualities:
              - WEBDL-1080p
              - WEBRip-1080p
          - name: HDTV-1080p
          - name: Bluray-720p
          - name: WEB 720p
            qualities:
              - WEBDL-720p
              - WEBRip-720p
          - name: HDTV-720p
          - name: Bluray-480p
          - name: WEB 480p
            qualities:
              - WEBRip-480p
              - WEBDL-480p
          - name: DVD
          - name: SDTV

    # Local overrides on top of the TRaSH profiles:
    custom_formats:
      # DV Profile 5 (Dolby Vision with no HDR10 base layer). This is where it
      # actually bit us — every audited P5 file was a TV episode (Doctor Who
      # 2023, Spider-Noir, Shrinking). Floor it so HDR10/1080p always wins; only
      # grabbed if literally nothing else exists.
      - trash_ids:
          - 9b27ab6498ec0f31a3353992e19434ca  # DV (w/o HDR fallback)
        assign_scores_to:
          - name: WEB-2160p
            score: -10000
      # Mild non-English penalty for standard TV only. Deliberately NOT applied
      # to the anime profile (anime is Japanese audio by nature).
      - trash_ids:
          - 69aa1e159f97d860440b04cd6d590c4f  # Language: Not English
        assign_scores_to:
          - name: WEB-2160p
            score: -50
      # Anime: prefer English audio WITHOUT requiring it, so sub-only airing
      # shows still grab. A positive nudge, not a ban.
      #
      # The nudge has to out-weigh the anime tier scores (best seen ~1300-1400),
      # otherwise a dub that arrives AFTER a Japanese copy scores lower than it,
      # is not an upgrade, sits in importPending, and decluttarr's
      # remove_failed_imports deletes + blocklists it -> Sonarr falls back to
      # Japanese. That is how SPY x FAMILY S1E10/E11 and others ended up
      # Japanese-only (2026-10). 2000 beats any tier, so a dub always upgrades a
      # Japanese file and a Japanese release can never replace a dub.
      #
      # "Dubs Only" is TRaSH's -10000 for dub-only releases (e.g. Yameii's
      # "[English Dub]" CR WEB-DL). Our dub source IS dub-only, so floor-ing it
      # was wrong for this library. Its regex excludes Dual/Multi Audio, so it
      # never overlaps with Anime Dual Audio.
      #
      # Limit: Sonarr compares QUALITY first. A WEB-DL dub still will not
      # replace a Bluray Japanese file; only the common airing case (WEB vs WEB)
      # and the below-minimum-score case are fixed.
      - trash_ids:
          - 418f50b10f1907201b6cfdf881f467b7  # Anime Dual Audio
          - 9c14d194486c4014d422adc64092d794  # Dubs Only
        assign_scores_to:
          - name: '[Anime] Remux-1080p'
            score: 2000
      # --- Best Available (SD-1080p) only ---------------------------------
      # THE load-bearing score on this profile. Every 720p/1080p "release" of a
      # DVD-era show is an AI upscale of the SD master. Without this floor,
      # Voyager grabs DVD and then immediately "upgrades" to one of the 40
      # HDTV-720p upscales the indexers carry -- churn AND worse picture. With
      # it, Voyager settles on DVD and stays put. Native-1080p shows assigned to
      # this profile are unaffected: they aren't upscales, so the CF misses them.
      - trash_ids:
          - 23297a736ca77c0fc8e70f8edd7ee56c  # Upscaled
        assign_scores_to:
          - name: Best Available (SD-1080p)
            score: -10000
          - name: Best Available (up to 4K)
            score: -10000
      # Standard junk floors. min_format_score is 0, so -10000 = hard reject.
      - trash_ids:
          - 9c11cd3f07101cdba90a2d81cf0e56b4  # LQ
          - e2315f990da2e2cbfc9fa5b7a6fcfe48  # LQ (Release Title)
          - 85c61753df5da1fb2aab6f2a47426b09  # BR-DISK
          - 32b367365729d530ca1c124a0b180c64  # Bad Dual Groups
        assign_scores_to:
          - name: Best Available (SD-1080p)
            score: -10000
          - name: Best Available (up to 4K)
            score: -10000
      # Foreign dubs of English shows. WEB-2160p gets this from TRaSH; this
      # profile had no language rule at all, so Clone Wars S3E15/E17/E22 grabbed
      # NORWEGiAN/DANiSH Blu-rays (2026-10-14). -10000 matches WEB-2160p; unlike
      # "Not English" this only fires when the audio is not the show's ORIGINAL
      # language, so foreign-original shows are unaffected.
      - trash_ids:
          - ae575f95ab639ba5d15f663bf019e3e8  # Language: Not Original
        assign_scores_to:
          - name: Best Available (SD-1080p)
            score: -10000
      # Belt-and-braces on the 1080p-capped profile (DV P5 cannot reach it); REAL
      # on 'up to 4K', which allows 2160p.
      - trash_ids:
          - 9b27ab6498ec0f31a3353992e19434ca  # DV (w/o HDR fallback)
        assign_scores_to:
          - name: Best Available (SD-1080p)
            score: -10000
          - name: Best Available (up to 4K)
            score: -10000

      # --- Best Available (up to 4K) only: mirror of WEB-2160p's scoring ----
      # A copy of every non-zero score on WEB-2160p (WEB release-group tiers, HDR,
      # streaming-service boosts, repacks, and the -10000 hard rejects incl.
      # x265 (no HDR/DV) and AV1), so 4K picks are chosen the same way on both
      # profiles. The floors already assigned above (DV P5, Upscaled, LQ x2,
      # BR-DISK, Bad Dual Groups) are not repeated here.
      # DELIBERATELY NOT COPIED: "Language: Not English" -50. Under
      # min_format_score 0 that is a hard reject of every foreign-original show
      # (the same trap that blocked Victims of Sin on Radarr); "Not Original"
      # -10000 below already covers the case it was meant for, a dub of an
      # English show. Re-diff against WEB-2160p if TRaSH changes its scores.
      - trash_ids:
          - e6258996055b9fbab7e9cb2f75819294  # WEB Tier 01
        assign_scores_to:
          - name: Best Available (up to 4K)
            score: 1700
      - trash_ids:
          - 58790d4e2fdcd9733aa7ae68ba2bb503  # WEB Tier 02
        assign_scores_to:
          - name: Best Available (up to 4K)
            score: 1650
      - trash_ids:
          - d84935abd3f8556dcd51d4f27e22d0a6  # WEB Tier 03
          - d0c516558625b04b363fa6c5c2c7cfd4  # WEB Scene
        assign_scores_to:
          - name: Best Available (up to 4K)
            score: 1600
      - trash_ids:
          - 505d871304820ba7106b693be6fe4a9e  # HDR
        assign_scores_to:
          - name: Best Available (up to 4K)
            score: 500
      - trash_ids:
          - 89358767a60cc28783cdc3d0be9388a4  # DSNP
          - d34870697c9db575f17700212167be23  # NF
          - d660701077794679fd59e8bdf4ce3a29  # AMZN
          - d9e511921c8cedc7282e291b0209cdc5  # ATV
          - f67c9ca88f463a48346062e8ad07713f  # ATVP
          - 77a7b25585c18af08f60b1547bb9b4fb  # CC
          - 36b72f59f4ea20aad9316f475f2d9fbb  # DCU
          - 7a235133c87f7da4c8cccceca7e3c7a6  # HBO
          - a880d6abc21e7c16884f3ae393f84179  # HMAX
          - f6cce30f1733d5c8194222a7507909bb  # HULU
          - 0ac24a2a68a9700bcb7eeca8e5cd644c  # iT
          - 81d1fbf600e2540cee87f3a23f9d3c1c  # MAX
          - 1656adc6d7bb2c8cca6acfb6592db421  # PCOK
          - c67a75ae4a1715f2bb4d492755ba4195  # PMTP
          - 6eb71887a8db6e783dd398446eb0e65d  # PLAY
          - da393fd4e2c0cce7c9dc2669c43e0593  # ROKU
          - ae58039e1319178e6be73caab5c42166  # SHO
          - 1efe8da11bfd74fbbcd4d8117ddb9213  # STAN
          - 9623c5c9cac8e939c1b9aedd32f640bf  # SYFY
          - 218e93e5702f44a68ad9e3c6ba87d2f0  # HD Streaming Boost
          - 43b3cf48cb385cd3eac608ee6bca7f09  # UHD Streaming Boost
        assign_scores_to:
          - name: Best Available (up to 4K)
            score: 75
      - trash_ids:
          - 44e7c4de10ae50265753082e5dc76047  # Repack3
        assign_scores_to:
          - name: Best Available (up to 4K)
            score: 7
      - trash_ids:
          - eb3d5cc0a2be0db205fb823640db6a3c  # Repack2
        assign_scores_to:
          - name: Best Available (up to 4K)
            score: 6
      - trash_ids:
          - ec8fa7296b64e8cd390a1600981f3923  # Repack/Proper
        assign_scores_to:
          - name: Best Available (up to 4K)
            score: 5
      - trash_ids:
          - 15a05bc7c1a36e2b57fd628f8977e2fc  # AV1
          - ae575f95ab639ba5d15f663bf019e3e8  # Language: Not Original
          - 9b64dff695c2115facf1b6ea59c9bd07  # x265 (no HDR/DV)
          - 6f808933a71bd9666531610cb8c059cc  # BR-DISK (BTN)
          - fbcb31d8dabd2a319072b84fc0b7249c  # Extras
        assign_scores_to:
          - name: Best Available (up to 4K)
            score: -10000

    # CF groups for the standard WEB-2160p profile. The anime profile pulls in
    # its own anime-tier CFs automatically from its quality-profile score set.
    custom_format_groups:
      add:
        - trash_id: e3f37512790f00d0e89e54fe5e790d1c  # [Optional] Golden Rule UHD
          select:
            - 9b64dff695c2115facf1b6ea59c9bd07  # x265 (no HDR/DV)
        - trash_id: 85fae4a2294965b75710ef2989c850eb  # [Streaming Services] HD/UHD boost
          select:
            - 218e93e5702f44a68ad9e3c6ba87d2f0  # HD Streaming Boost
            - 43b3cf48cb385cd3eac608ee6bca7f09  # UHD Streaming Boost
        - trash_id: 59c3af66780d08332fdc64e68297098f  # [Unwanted] Unwanted Formats
          select:
            - 15a05bc7c1a36e2b57fd628f8977e2fc  # AV1
            - 32b367365729d530ca1c124a0b180c64  # Bad Dual Groups
            - 85c61753df5da1fb2aab6f2a47426b09  # BR-DISK
            - 6f808933a71bd9666531610cb8c059cc  # BR-DISK (BTN)
            - fbcb31d8dabd2a319072b84fc0b7249c  # Extras
            - 9c11cd3f07101cdba90a2d81cf0e56b4  # LQ
            - e2315f990da2e2cbfc9fa5b7a6fcfe48  # LQ (Release Title)
            - 23297a736ca77c0fc8e70f8edd7ee56c  # Upscaled
