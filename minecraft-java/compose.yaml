services:
  minecraft-java:
    container_name: minecraft-java
    image: itzg/minecraft-server
    user: "1000:1000"
    stdin_open: true
    tty: true
    environment:
      EULA: "TRUE"
      TYPE: "FABRIC"
      # Server pin. je2be converts to 1.21.10; we run 1.21.11 (the last 1.21 patch, full mod
      # support) and let the world upgrade forward on load. Server must be >= the world version.
      VERSION: "1.21.11"
      INIT_MEMORY: "1G"
      MAX_MEMORY: "4G"
      USE_AIKAR_FLAGS: "TRUE"
      ENABLE_RCON: "TRUE"
      RCON_PASSWORD: "${RCON_PASSWORD}"
      # Named console-in pipe so `mc-send-to-console` can run commands whose output RCON drops
      # (LuckPerms/Adventure components) — output then appears in `docker logs`.
      CREATE_CONSOLE_IN_PIPE: "TRUE"
      OVERRIDE_SERVER_PROPERTIES: "TRUE"
      MOTD: "Han shot first"
      DIFFICULTY: "normal"
      VIEW_DISTANCE: "10"
      TZ: "America/Chicago"
      # Auto-syncs server-side mods from the Forgejo-hosted packwiz pack on every boot.
      PACKWIZ_URL: "https://forgejo.jamnapari-goblin.ts.net/Chris10/lofland-minecraft-pack/raw/branch/main/pack.toml"
    volumes:
      - ${VOL_MINECRAFT_JAVA_DATA:-~/container-data}/container-mounts/minecraft-java/data:/data
    healthcheck:
      test: ["CMD", "mc-health"]
      start_period: 300s
      interval: 30s
      timeout: 10s
      retries: 6
    network_mode: service:ts
    depends_on:
      ts:
        condition: service_healthy
    labels:
      # For homepage
      - homepage.group=${HOMEPAGE_GROUP}
      - homepage.name=The Unknown Regions
      - homepage.weight=490
      - homepage.icon=minecraft.png
      # Live status / player-count widget (Java status ping).
      # Uses the tailnet name, not the LAN IP: this host's LAN address is
      # DHCP-assigned and has changed before, which would silently break the widget.
      - homepage.widget.type=minecraft
      - homepage.widget.url=udp://minecraft-java.${TS_DOMAIN}:25565
    # The JVM heap is capped by MAX_MEMORY, but metaspace/direct buffers live outside
    # it; this bounds total RSS on a host that has livelocked on memory before.
    mem_limit: 5g
    restart: on-failure

  # Rotating world backups. Uses RCON (save-off/save-all flush/save-on) for consistent
  # snapshots, skips backups when nobody's online, and prunes old snapshots.
  #
  # BACKUP_METHOD=rsync (not the default tar) because this host stores /backups on ZFS
  # and archives it with borg, and both hate compressed tarballs:
  #   - rsync --link-dest hardlinks unchanged files, so each extra snapshot costs
  #     ~nothing on disk (measured: 1789 of 1791 files hardlinked).
  #   - borg dedupes the uncompressed tree; a repeat snapshot costs ~3 KB. The old
  #     .tar.gz cost borg the FULL 358 MB every time, since gzip destroys dedupe --
  #     two tarballs of an unchanged world deduplicated to 0%.
  # These snapshots are also the only RCON-quiesced copy: borg's nightly pass over the
  # live data/world can catch a region file mid-write, so keep /backups in the archive.
  mc-backup:
    container_name: minecraft-java-backup
    image: itzg/mc-backup
    user: "1000:1000"
    environment:
      BACKUP_METHOD: "rsync"
      # Maintains a `latest` symlink, used as the --link-dest base and handy for restores.
      LINK_LATEST: "true"
      BACKUP_INTERVAL: "6h"
      PRUNE_BACKUPS_DAYS: "7"
      PAUSE_IF_NO_PLAYERS: "true"
      INITIAL_DELAY: "2m"
      RCON_HOST: "localhost"
      RCON_PASSWORD: "${RCON_PASSWORD}"
      TZ: "America/Chicago"
    volumes:
      - ${VOL_MINECRAFT_JAVA_DATA:-~/container-data}/container-mounts/minecraft-java/data:/data:ro
      - ${VOL_MINECRAFT_JAVA_BACKUPS:-~/container-data}/container-mounts/minecraft-java/backups:/backups
    network_mode: service:ts
    depends_on:
      minecraft-java:
        condition: service_healthy
    # Healthy = the backup target is writable (catches the root:root mount-perms bug that
    # otherwise fails every tar). Without a healthcheck the platform monitor flags the whole
    # project, since it treats any non-"(healthy)" container as unhealthy.
    healthcheck:
      test: ["CMD-SHELL", "touch /backups/.hc && rm -f /backups/.hc || exit 1"]
      start_period: 30s
      interval: 60s
      timeout: 10s
      retries: 3
    restart: on-failure

  ts:
    container_name: minecraft-java-ts
    image: tailscale/tailscale
    environment:
      - TS_HOSTNAME=minecraft-java
      # Use the kernel TUN device instead of the image's default userspace
      # networking. In userspace mode tailscaled reassembles every tailnet
      # packet in a gVisor netstack and re-injects it over loopback, which
      # measured ~11% inbound UDP loss on this host. The Java game protocol is
      # TCP and masks that with retransmits, but Simple Voice Chat (UDP 24454)
      # does not. Requires /dev/net/tun plus net_admin, both already granted
      # below. See docs/TAILSCALE_KERNEL_MODE_ROLLOUT.md
      - TS_USERSPACE=false
      - TS_EXTRA_ARGS=--advertise-tags=tag:container
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_ENABLE_HEALTH_CHECK=true
      - TS_LOCAL_ADDR_PORT=127.0.0.1:9002
      - TS_AUTHKEY=${TS_AUTHKEY}
    volumes:
      - ${TS_STATE_HOST_DIR}:/var/lib/tailscale
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - net_admin
      - sys_module
    # https://github.com/tailscale/tailscale/issues/12758#issuecomment-2564770640
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:9002/healthz"]
      start_period: 300s
      start_interval: 5s
      interval: 5m
      timeout: 5s
      retries: 3
    ports:
      # Exposed here (on the ts sidecar's netns) so LAN players connect without
      # Tailscale crypto overhead; tailnet players reach it via MagicDNS too.
      # Java Edition uses TCP 25565. RCON (25575) is deliberately NOT exposed.
      - "25565:25565/tcp"
      # Simple Voice Chat (Phase 3 mod) default UDP port; harmless until the mod exists.
      - "24454:24454/udp"
    restart: on-failure
