services:
  formbricks_postgres:
    container_name: formbricks_postgres
    restart: on-failure
    image: pgvector/pgvector:pg17
    volumes:
      - ${VOL_FORMBRICKS_DATA:-~/container-data}/container-mounts/formbricks/data:/var/lib/postgresql/data
    environment:
      - POSTGRES_PASSWORD=${FORMBRICKS_POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres || exit 1"]
      start_period: 300s
      start_interval: 5s
      interval: 5m
      timeout: 5s
      retries: 3
    networks:
      - caddy-net
  formbricks_redis:
    container_name: formbricks_redis
    restart: on-failure
    image: valkey/valkey
    command: valkey-server --appendonly yes
    volumes:
      - ${VOL_FORMBRICKS_REDIS:-~/container-data}/container-mounts/formbricks/redis:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      start_period: 300s
      start_interval: 5s
      interval: 5m
      timeout: 5s
      retries: 3
    networks:
      - caddy-net
  # Formbricks Hub API. As of the 2026-05 image, the Formbricks app refuses to
  # boot unless Hub and Cube are reachable. Hub bundles its own DB migration
  # tools (goose + river); upstream runs them in a one-shot "hub-migrate"
  # container, but a one-shot that exits would read as perpetually unhealthy to
  # this platform's health monitor, so we instead fold the migrations into Hub's
  # own startup (run once, then exec the API). Migrations are idempotent, so this
  # is safe to repeat on every start/update. Shares the Formbricks Postgres DB.
  formbricks_hub:
    container_name: formbricks_hub
    restart: on-failure
    image: ghcr.io/formbricks/hub
    depends_on:
      formbricks_postgres:
        condition: service_healthy
    entrypoint: ["sh", "-c"]
    command:
      - '/usr/local/bin/goose -dir /app/migrations postgres "$$DATABASE_URL" up && /usr/local/bin/river migrate-up --database-url "$$DATABASE_URL" && exec /app/hub-api'
    environment:
      - API_KEY=${HUB_API_KEY}
      - DATABASE_URL=postgresql://postgres:${FORMBRICKS_POSTGRES_PASSWORD}@formbricks_postgres:5432/formbricks?sslmode=disable
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:8080/health || exit 1"]
      start_period: 300s
      start_interval: 5s
      interval: 5m
      timeout: 10s
      retries: 5
    networks:
      - caddy-net
  # Cube semantic-layer API that powers Formbricks analytics. Reads from the
  # Formbricks Postgres (the feedback_records table created by Hub's migrations),
  # so it waits for formbricks_hub to be healthy. The cube.js config and schema
  # model are bind-mounted from the cube volume (populated from the upstream
  # docker/cube/ directory).
  formbricks_cube:
    container_name: formbricks_cube
    restart: on-failure
    image: cubejs/cube:v1.6.6
    depends_on:
      formbricks_postgres:
        condition: service_healthy
      formbricks_hub:
        condition: service_healthy
    environment:
      - CUBEJS_DB_TYPE=postgres
      - CUBEJS_DB_HOST=formbricks_postgres
      - CUBEJS_DB_NAME=formbricks
      - CUBEJS_DB_USER=postgres
      - CUBEJS_DB_PASS=${FORMBRICKS_POSTGRES_PASSWORD}
      - CUBEJS_DB_PORT=5432
      - CUBEJS_API_SECRET=${CUBEJS_API_SECRET}
      - CUBEJS_JWT_ISSUER=formbricks-web
      - CUBEJS_JWT_AUDIENCE=formbricks-cube
      - CUBEJS_DEFAULT_API_SCOPES=meta,data
      - CUBEJS_CACHE_AND_QUEUE_DRIVER=memory
    volumes:
      - ${VOL_FORMBRICKS_CUBE:-~/container-data}/container-mounts/formbricks/cube/cube.js:/cube/conf/cube.js:ro
      - ${VOL_FORMBRICKS_CUBE:-~/container-data}/container-mounts/formbricks/cube/schema:/cube/conf/model:ro
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:4000/readyz', (res) => { res.resume(); process.exit(res.statusCode === 200 ? 0 : 1); }).on('error', () => process.exit(1));"]
      start_period: 300s
      start_interval: 5s
      interval: 5m
      timeout: 10s
      retries: 5
    networks:
      - caddy-net
  formbricks:
    container_name: formbricks
    restart: on-failure
    image: ghcr.io/formbricks/formbricks
    depends_on:
      formbricks_postgres:
        condition: service_healthy
      formbricks_redis:
        condition: service_healthy
      formbricks_hub:
        condition: service_healthy
      formbricks_cube:
        condition: service_healthy
    volumes:
      - ${VOL_FORMBRICKS_SAML_CONNECTION:-~/container-data}/container-mounts/formbricks/saml-connection:/home/nextjs/apps/web/saml-connection
    networks:
      - caddy-net
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO - http://127.0.0.1:3000/ | grep -q '<title>Formbricks</title>'",
        ]
      start_period: 300s
      start_interval: 5s
      interval: 5m
      timeout: 30s
      retries: 5
    environment:
      - DATABASE_URL=postgresql://postgres:${FORMBRICKS_POSTGRES_PASSWORD}@formbricks_postgres:5432/formbricks?schema=public
      - REDIS_URL=redis://formbricks_redis:6379
      - EMAIL_VERIFICATION_DISABLED=1
      - PASSWORD_RESET_DISABLED=1
      - WEBAPP_URL=${WEBAPP_URL}
      - NEXTAUTH_URL=${NEXTAUTH_URL}
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
      - CRON_SECRET=${CRON_SECRET}
      - HUB_API_KEY=${HUB_API_KEY}
      - HUB_API_URL=http://formbricks_hub:8080
      - CUBEJS_API_URL=http://formbricks_cube:4000
      - CUBEJS_API_SECRET=${CUBEJS_API_SECRET}
      - CUBEJS_JWT_ISSUER=formbricks-web
      - CUBEJS_JWT_AUDIENCE=formbricks-cube
networks:
  caddy-net:
    external: true
