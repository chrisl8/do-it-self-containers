services:
  stirling-pdf:
    container_name: stirling-pdf
    image: stirlingtools/stirling-pdf:2.14.3
    # Stirling is a Spring Boot JVM and its image sets MaxRAMPercentage=75, so unbounded its
    # heap can grow to ~75% of host RAM (~23 GiB on this 31 GiB box) -- the worst of the
    # host-RAM-ballooning JVMs (see the 2026-06-12 Elasticsearch livelock). JAVA_CUSTOM_OPTS
    # pins the heap to 1 GiB; mem_limit/memswap_limit hard-bound the container (JVM heap +
    # the OCR/conversion subprocesses it spawns: tesseract, libreoffice, ghostscript) with
    # swap disabled. Raise both together if a large conversion ever gets OOM-killed.
    mem_limit: 2g
    memswap_limit: 2g
    volumes:
      - ${VOL_STIRLING_PDF_TESSDATA:-~/container-data}/container-mounts/stirling-pdf/tessdata:/usr/share/tessdata #Required for extra OCR languages
      - ${VOL_STIRLING_PDF_CONFIGS:-~/container-data}/container-mounts/stirling-pdf/configs:/configs
    # - ./customFiles:/customFiles/ # Not used yet.
    # - ./logs:/logs/ # Don't care, they can be lost
    environment:
      - DOCKER_ENABLE_SECURITY=false
      - INSTALL_BOOK_AND_ADVANCED_HTML_OPS=true
      - LANGS=en_US
      # Pin JVM heap (image default is MaxRAMPercentage=75 of host RAM). -Xmx wins over the
      # percentage; 1 GiB is ample for the Spring Boot app (heavy work runs in subprocesses).
      - JAVA_CUSTOM_OPTS=-Xmx1024m
    networks:
      - stirling-pdf-net
    healthcheck:
      test: 'curl --fail -s http://localhost:8080/api/v1/info/status 2>/dev/null | grep "\"status\":\"UP\"" || exit 1'
      start_period: 600s
      start_interval: 5s
      interval: 5m
      timeout: 5s
      retries: 3
    labels:
      # For homepage
      - homepage.group=${HOMEPAGE_GROUP}
      - homepage.name=Stirling PDF
      - homepage.weight=30
      - homepage.icon=/dashboard-icons/svg/stirling-pdf.svg
      - homepage.href=https://stirling-pdf.${TS_DOMAIN}
    restart: on-failure
  ts:
    container_name: stirling-pdf-ts
    image: tailscale/tailscale
    environment:
      - TS_HOSTNAME=stirling-pdf
      - TS_EXTRA_ARGS=--advertise-tags=tag:container
      - TS_SERVE_CONFIG=/config/tailscale-config.json
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_ENABLE_HEALTH_CHECK=true
      - TS_LOCAL_ADDR_PORT=127.0.0.1:9002
      - TS_AUTHKEY=${TS_AUTHKEY}
    volumes:
      - ${TS_STATE_HOST_DIR}:/var/lib/tailscale
      - ./tailscale-config:/config
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - net_admin
      - sys_module
    # https://github.com/tailscale/tailscale/issues/12758#issuecomment-2564770640
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:9002/healthz"]
      start_period: 300s
      start_interval: 5s
      interval: 5m
      timeout: 5s
      retries: 3
    networks:
      - stirling-pdf-net
    depends_on:
      stirling-pdf:
        condition: service_healthy
    restart: on-failure
networks:
  stirling-pdf-net:
