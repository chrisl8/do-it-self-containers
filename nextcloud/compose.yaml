# https://hub.docker.com/_/nextcloud/
services:
  nextcloud:
    # Pinned to a major: Nextcloud refuses to skip majors, so bump deliberately
    # one major at a time. DIUN digest-watches :34 for 34.0.x patches; the
    # watch_repo label below additionally alerts when a new major (35, ...) ships.
    image: nextcloud:34
    container_name: nextcloud
    volumes:
      - ${VOL_NEXTCLOUD_HTML:-~/container-data}/container-mounts/nextcloud/html:/var/www/html
      # HSTS header — TLS is terminated by the ts sidecar (which can't add headers),
      # so Nextcloud's Apache sets Strict-Transport-Security itself. See hsts.conf.
      - ./hsts.conf:/etc/apache2/conf-enabled/hsts.conf:ro
    environment:
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
      - MYSQL_DATABASE=nextcloud
      - MYSQL_USER=nextcloud
      - MYSQL_HOST=db
      - NEXTCLOUD_ADMIN_USER=${NEXTCLOUD_ADMIN_USER}
      - NEXTCLOUD_ADMIN_PASSWORD=${NEXTCLOUD_ADMIN_PASSWORD}
      - PHP_MEMORY_LIMIT=2048M
    networks:
      - nextcloud-net
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: 'runuser -s /usr/local/bin/php - www-data /var/www/html/occ status 2>/dev/null | grep -e "installed: true" -e "maintenance: false" -e "needsDbUpgrade: false" | wc -l | [ "`cat`" = "3" ]'
      start_period: 300s
      start_interval: 5s
      interval: 5m
      # occ spins up PHP — give it slack so a busy disk/backup doesn't flap it
      timeout: 15s
      retries: 5
    labels:
      # For homepage
      - homepage.group=${HOMEPAGE_GROUP}
      - homepage.name=Nextcloud
      - homepage.weight=30
      - homepage.icon=/dashboard-icons/svg/nextcloud.svg
      - homepage.href=https://nextcloud.${TS_DOMAIN}
      - homepage.widget.type=nextcloud
      - homepage.widget.url=https://nextcloud.${TS_DOMAIN}
      - homepage.widget.username=${USERNAME_FOR_HOMEPAGE}
      - homepage.widget.password=${PASSWORD_FOR_HOMEPAGE}
      - homepage.widget.fields=["freespace", "numfiles"]
      # DIUN: :34 already digest-watches for 34.x point releases. watch_repo with
      # a bare-major regex additionally alerts when a NEW major (35, 36, ...)
      # appears, so we get the signal to plan the next deliberate major upgrade.
      - diun.watch_repo=true
      - diun.include_tags=^[0-9]+$
    restart: on-failure
  db:
    container_name: nextcloud-db
    image: mariadb:10
    volumes:
      - ${VOL_NEXTCLOUD_DB:-~/container-data}/container-mounts/nextcloud/db:/var/lib/mysql
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
      - MYSQL_DATABASE=nextcloud
      - MYSQL_USER=nextcloud
    networks:
      - nextcloud-net
    # https://mariadb.com/kb/en/using-healthcheck-sh/
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      start_period: 300s
      start_interval: 5s
      interval: 5m
      timeout: 5s
      retries: 3
    restart: on-failure
  elasticsearch:
    # Notes:
    # The best documentation for this is their Install Script, but it is a bear to parse:
    # https://github.com/nextcloud/vm/blob/main/apps/fulltextsearch.sh
    # You must set both the Address of the Servlet, like so:
    # http://elastic:the-actual-password@nextcloud-elasticsearch:9200/
    # and the "Index", which can be any text string, so I just put in:
    # my_index
    #
    # You can exec into the container and run this to test that it is set up correctly:
    # php occ fulltextsearch:test
    # And kick off the indexing:
    # php occ fulltextsearch:index
    #
    # You can also run the indexing in the background:
    # php occ fulltextsearch:index --background
    #
    # It should take care of indexing new/changed documents on its own.
    #
    # OPT-IN: gated behind the "fulltextsearch" compose profile, so it does NOT start by
    # default. This JVM twice took down the 31 GiB host (2026-06-12 livelock, 2026-06-14 OOM),
    # and full-text search is a feature most installs never use. Nextcloud runs fine without it
    # (filename search still works). To use full-text search: start the stack with
    # COMPOSE_PROFILES=fulltextsearch and re-enable the fulltextsearch* apps via occ
    # (occ app:enable fulltextsearch fulltextsearch_elasticsearch files_fulltextsearch).
    profiles: ["fulltextsearch"]
    container_name: nextcloud-elasticsearch
    # The github repo for the plugin says it only works with version 8, so this may be unwise:
    image: elasticsearch:9.1.0
    # Hard memory cap. Unbounded, this JVM grew to ~15.6 GiB and livelocked the 31 GiB host on 2026-06-12
    # (memory-pressure -> dirty-page writeback stall -> every storage task wedged in D-state, OOM killer
    # never ran). mem_limit + memswap_limit equal disables swap for this container, so a runaway ES gets a
    # contained cgroup OOM-kill (restart: on-failure brings it back) instead of taking down the whole box.
    mem_limit: 1536m
    memswap_limit: 1536m
    # The install script, mentioned above, # https://github.com/nextcloud/vm/blob/main/apps/fulltextsearch.sh recommends
    # some more settings that I left out. If you run into trouble, you can try them.
    environment:
      # Cap the JVM heap. ES sizes its heap to ~50% of visible RAM by default; on this shared host that meant
      # ~15.6 GiB. 512m is ample for a personal Nextcloud full-text index. Keep heap <= ~50% of mem_limit so
      # there is headroom for Lucene off-heap/mmap usage under the cgroup ceiling.
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
      - discovery.type=single-node
      # Use this to enable Basic Authentication:
      - xpack.security.enabled=true
      - xpack.security.http.ssl.enabled=false
      - ELASTIC_PASSWORD=${ELASTIC_PASSWORD}
    volumes:
      # Use named volume because of permission problems
      - ${VOL_NEXTCLOUD_ELASTICSEARCH_DATA:-~/container-data}/container-mounts/nextcloud/elasticsearch_data:/usr/share/elasticsearch/data
    networks:
      - nextcloud-net
    healthcheck:
      test: curl --fail -u elastic:${ELASTIC_PASSWORD} http://localhost:9200/_cat/health?h=status 2>/dev/null | grep -q "green\|yellow" || exit 1
      start_period: 300s
      start_interval: 5s
      interval: 5m
      # ES cluster-health curl — give it slack so a busy disk/backup doesn't flap it
      timeout: 15s
      retries: 5
    restart: on-failure
  ts-nextcloud:
    container_name: nextcloud-ts
    image: tailscale/tailscale
    environment:
      - TS_HOSTNAME=nextcloud
      # Kernel-mode networking. The image defaults to TS_USERSPACE=true, whose gVisor
      # netstack drops ~11% of inbound UDP and burns far more CPU per byte — this is
      # the largest sync/upload service on the tailnet, so that cost is paid often.
      # trusted_proxies is the 255.255.255.255 sentinel and trusted_domains are
      # hostnames, so neither is affected by the source-IP change. See
      # docs/TAILSCALE_KERNEL_MODE_ROLLOUT.md in the containers repo.
      - TS_USERSPACE=false
      - TS_EXTRA_ARGS=--advertise-tags=tag:container
      - TS_SERVE_CONFIG=/config/tailscale-config.json
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_ENABLE_HEALTH_CHECK=true
      - TS_LOCAL_ADDR_PORT=127.0.0.1:9002
      - TS_AUTHKEY=${TS_AUTHKEY}
    volumes:
      - ${TS_STATE_HOST_DIR}:/var/lib/tailscale
      - ./tailscale-config:/config
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - net_admin
      - sys_module
    # https://github.com/tailscale/tailscale/issues/12758#issuecomment-2564770640
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:9002/healthz"]
      start_period: 300s
      start_interval: 5s
      interval: 5m
      timeout: 5s
      retries: 3
    networks:
      - nextcloud-net
    depends_on:
      nextcloud:
        condition: service_healthy
    restart: on-failure
networks:
  nextcloud-net:
