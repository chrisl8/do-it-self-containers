# Strict-Transport-Security: TLS is terminated by the Tailscale sidecar
# (tailscale serve, 443 -> http://nextcloud:80), which cannot inject response
# headers, so HSTS must come from Nextcloud's own Apache. Mounted into
# conf-enabled/ and applied to every response. 15552000s (180 days) is the
# minimum Nextcloud's admin setup check accepts.
<IfModule mod_headers.c>
  Header always set Strict-Transport-Security "max-age=15552000; includeSubDomains"
</IfModule>
