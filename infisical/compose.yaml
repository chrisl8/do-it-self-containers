# https://infisical.com/docs/self-hosting/deployment-options/docker-compose
# Self-hosted secret manager for injecting credentials into containers.
# Bootstrap with: scripts/setup-infisical.sh
services:
  infisical:
    container_name: infisical
    # Pinned (not floating like the rest of the stack): runs irreversible DB
    # migrations on startup and is the secret-store every other container
    # depends on; upgrade deliberately (snapshot the DB first, read the notes).
    image: infisical/infisical:v0.162.7
    depends_on:
      infisical-db:
        condition: service_healthy
      infisical-redis:
        condition: service_healthy
    # Localhost-only: the web-admin, setup script, and all-containers.sh
    # all reach the API on localhost. Infisical is intentionally not exposed
    # to the network — secrets shouldn't leave the host.
    ports:
      - 127.0.0.1:8085:8080
    environment:
      - AUTH_SECRET=${AUTH_SECRET}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
      - SITE_URL=${INFISICAL_SITE_URL:-http://localhost:8085}
      - DB_CONNECTION_URI=postgresql://infisical:${DB_PASSWORD}@infisical-db:5432/infisical
      - REDIS_URL=redis://infisical-redis:6379
      # Telemetry opt-out
      - TELEMETRY_ENABLED=false
    networks:
      - infisical-net
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8080/api/status"]
      start_period: 300s
      start_interval: 10s
      interval: 5m
      timeout: 10s
      retries: 3
    labels:
      # DIUN: the pinned tag's digest never moves, so default digest-watching
      # never fires. watch_repo enumerates repo tags and alerts on any new
      # release so we know when to do a deliberate, manual upgrade.
      - diun.watch_repo=true
      - diun.include_tags=^v[0-9]+\.[0-9]+\.[0-9]+-postgres$
    restart: on-failure
  infisical-db:
    container_name: infisical-db
    image: postgres:14-alpine
    # Postgres caches an fd per relation file segment and deliberately fills
    # that cache up to max_files_per_process (default 1000), parking backends
    # at ~990 open files. Against Docker's default 1024 soft limit that reads
    # as 96.7% and trips netdata's apps_group_file_descriptors_utilization
    # alarm every hour when Infisical's hourly job sweeps its tables. Postgres
    # still self-caps at 1000, so this changes no behavior -- it only restores
    # a denominator where the percentage means something.
    ulimits:
      nofile:
        soft: 4096
        hard: 524288
    environment:
      - POSTGRES_DB=infisical
      - POSTGRES_USER=infisical
      - POSTGRES_PASSWORD=${DB_PASSWORD}
    volumes:
      - ${VOL_INFISICAL_DB:-~/container-data}/container-mounts/infisical/db:/var/lib/postgresql/data
    networks:
      - infisical-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U infisical"]
      start_period: 300s
      start_interval: 5s
      interval: 5m
      timeout: 5s
      retries: 3
    restart: on-failure
  infisical-redis:
    container_name: infisical-redis
    image: redis:7-alpine
    volumes:
      - ${VOL_INFISICAL_REDIS:-~/container-data}/container-mounts/infisical/redis:/data
    networks:
      - infisical-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      start_period: 300s
      start_interval: 5s
      interval: 5m
      timeout: 5s
      retries: 3
    restart: on-failure
networks:
  infisical-net:
