# https://infisical.com/docs/self-hosting/deployment-options/docker-compose
# Self-hosted secret manager for injecting credentials into containers.
# Bootstrap with: scripts/setup-infisical.sh
services:
  infisical:
    container_name: infisical
    # Pinned (not floating like the rest of the stack): runs irreversible DB
    # migrations on startup and is the secret-store every other container
    # depends on; upgrade deliberately (snapshot the DB first, read the notes).
    image: infisical/infisical:v0.164.1
    depends_on:
      infisical-db:
        condition: service_healthy
      infisical-redis:
        condition: service_healthy
    # Localhost-only: the web-admin, setup script, and all-containers.sh
    # all reach the API on localhost. Infisical is intentionally not exposed
    # to the network — secrets shouldn't leave the host.
    ports:
      - 127.0.0.1:8085:8080
    environment:
      - AUTH_SECRET=${AUTH_SECRET}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
      - SITE_URL=${INFISICAL_SITE_URL:-http://localhost:8085}
      - DB_CONNECTION_URI=postgresql://infisical:${DB_PASSWORD}@infisical-db:5432/infisical
      - REDIS_URL=redis://infisical-redis:6379
      # Telemetry opt-out
      - TELEMETRY_ENABLED=false
    networks:
      - infisical-net
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8080/api/status"]
      start_period: 300s
      start_interval: 10s
      interval: 5m
      timeout: 10s
      retries: 3
    labels:
      # DIUN: the pinned tag's digest never moves, so default digest-watching
      # never fires. watch_repo enumerates repo tags and alerts on any new
      # release so we know when to do a deliberate, manual upgrade.
      # The tag is plain vX.Y.Z -- upstream dropped the -postgres suffix
      # between v0.140 and v0.150 (plain tags ARE the Postgres build), so a
      # pattern requiring that suffix matches nothing and silently never
      # alerts. Anchored to exclude the commit-SHA tags and `latest`.
      - diun.watch_repo=true
      - diun.include_tags=^v[0-9]+\.[0-9]+\.[0-9]+$
    restart: on-failure
  infisical-db:
    container_name: infisical-db
    # postgres:14-alpine -> 18-alpine and infisical-redis's redis:7-alpine ->
    # valkey:9-alpine below are a breaking-change generation
    # ("2026-08-postgres18-valkey") gated by module.yaml's `generation` field
    # for this container -- an existing install only receives this bump once
    # it has done the migration in docs/MAJOR_VERSION_UPGRADE_GOTCHAS.md and
    # set user-config.yaml containers.infisical.pinned_generation to match.
    # A fresh install has no pre-existing data to break and gets this
    # directly. NOTE: postgres 18's image wants its volume mounted at
    # /var/lib/postgresql (not .../data like every prior major).
    image: postgres:18-alpine
    # Postgres caches an fd per relation file segment and deliberately fills
    # that cache up to max_files_per_process (default 1000), parking backends
    # at ~990 open files. Against Docker's default 1024 soft limit that reads
    # as 96.7% and trips netdata's apps_group_file_descriptors_utilization
    # alarm every hour when Infisical's hourly job sweeps its tables. Postgres
    # still self-caps at 1000, so this changes no behavior -- it only restores
    # a denominator where the percentage means something.
    ulimits:
      nofile:
        soft: 4096
        hard: 524288
    environment:
      - POSTGRES_DB=infisical
      - POSTGRES_USER=infisical
      - POSTGRES_PASSWORD=${DB_PASSWORD}
    volumes:
      - ${VOL_INFISICAL_DB:-~/container-data}/container-mounts/infisical/db:/var/lib/postgresql
    networks:
      - infisical-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U infisical"]
      start_period: 300s
      start_interval: 5s
      interval: 5m
      timeout: 5s
      retries: 3
    restart: on-failure
  infisical-redis:
    container_name: infisical-redis
    # redis:7-alpine -> Valkey: sidesteps the Redis 8 relicensing question,
    # and Infisical's own Helm chart is separately adding Valkey support.
    # Same breaking-change generation as infisical-db above -- see the note
    # there and docs/MAJOR_VERSION_UPGRADE_GOTCHAS.md. An EXISTING redis:7.4.x
    # install cannot just swap images: it writes RDB format version 12, which
    # Valkey (forked at Redis 7.2.4) cannot read and crash-loops on -- the
    # stale dump.rdb must be inspected and cleared as part of the migration,
    # not just the image tag bumped. A fresh install's empty volume has
    # nothing to migrate and is unaffected.
    image: docker.io/valkey/valkey:9-alpine
    volumes:
      - ${VOL_INFISICAL_REDIS:-~/container-data}/container-mounts/infisical/redis:/data
    networks:
      - infisical-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      start_period: 300s
      start_interval: 5s
      interval: 5m
      timeout: 5s
      retries: 3
    restart: on-failure
networks:
  infisical-net:
